<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wedding RSVP">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="Img/favicon.ico">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <title>RSVP - Wedding Website</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="back-link">← Back to Home</a>
        </nav>
    </header>

    <main>
        <section class="rsvp-section">
            <div class="rsvp-container">
                <h1 class="rsvp-title">RSVP</h1>
                <form id="rsvpForm" class="rsvp-form" onsubmit="return handleSubmit(event)">
                    <div class="form-group">
                        <label for="guestName">Guest Name</label>
                        <input type="text" id="guestName" name="guestName" required>
                    </div>

                    <div class="form-group">
                        <label for="guestEmail">Email Address</label>
                        <input type="email" id="guestEmail" name="guestEmail" required>
                    </div>

                    <div class="form-group">
                        <label for="plusOne">Do you have a plus one?</label>
                        <select id="plusOne" name="plusOne" onchange="togglePlusOne()">
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>

                    <div id="plusOneSection" class="form-group plus-one-section" style="display: none;">
                        <label for="plusOneName">Plus One's Name</label>
                        <input type="text" id="plusOneName" name="plusOneName">
                    </div>

                    <div class="form-group response-group">
                        <div class="response-option">
                            <input type="radio" id="accept" name="response" value="accept" required>
                            <label for="accept" class="radio-label">
                                <span class="radio-circle"></span>
                                Accept with pleasure
                            </label>
                        </div>
                        <div class="response-option">
                            <input type="radio" id="decline" name="response" value="decline" required>
                            <label for="decline" class="radio-label">
                                <span class="radio-circle"></span>
                                Decline with regret
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="submit-button">Submit RSVP</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/rsvp.js"></script>
</body>
</html>
